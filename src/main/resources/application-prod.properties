# ============================================================
# PRODUÇÃO — Railway com PostgreSQL
# O RailwayEnvironmentPostProcessor detecta DATABASE_URL
# automaticamente. Este arquivo só sobrescreve se você definir
# SPRING_DATASOURCE_URL manualmente no Railway.
# ============================================================

# Usa SPRING_DATASOURCE_URL se definido manualmente; senão,
# o RailwayEnvironmentPostProcessor já configurou via DATABASE_URL
spring.datasource.url=${SPRING_DATASOURCE_URL:${spring.datasource.url:jdbc:h2:file:./data/javaduolingo;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${spring.datasource.username:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${spring.datasource.password:}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:${spring.datasource.driver-class-name:org.h2.Driver}}

spring.jpa.database-platform=${SPRING_JPA_PLATFORM:${spring.jpa.database-platform:org.hibernate.dialect.H2Dialect}}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=false

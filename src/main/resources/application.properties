spring.application.name=JavaDuolingo
server.port=8080

# H2 Database
spring.datasource.url=jdbc:h2:mem:javaduolingo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# Gemini AI API
gemini.api.key=${GEMINI_API_KEY:AIzaSyDemo-replace-with-real-key}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent

# Logging
logging.level.com.javaduolingo=INFO
logging.level.org.springframework.security=WARN

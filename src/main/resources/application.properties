spring.application.name=JavaDuolingo
server.port=${PORT:8080}

# Database — PostgreSQL no Railway, H2 local como fallback
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:javaduolingo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.sql.init.mode=never

# Thymeleaf
spring.thymeleaf.cache=true
spring.thymeleaf.encoding=UTF-8

# Groq AI API
groq.api.key=${GROQ_API_KEY:}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.api.model=llama-3.3-70b-versatile

# Logging
logging.level.com.javaduolingo=INFO
logging.level.org.springframework.security=WARN

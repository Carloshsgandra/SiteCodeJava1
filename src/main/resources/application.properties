spring.application.name=JavaDuolingo
server.port=${PORT:8080}

# Database — PostgreSQL no Railway, H2 local como fallback
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/javaduolingo;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Dialect auto-detectado pelo Hibernate a partir do DataSource (H2 ou PostgreSQL)
# spring.jpa.database-platform não definido — Hibernate 6 detecta automaticamente
spring.sql.init.mode=never

# Thymeleaf
spring.thymeleaf.cache=true
spring.thymeleaf.encoding=UTF-8

# Groq AI API
groq.api.key=${GROQ_API_KEY:}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.api.model=llama-3.3-70b-versatile


# Logging
logging.level.com.javaduolingo=INFO
logging.level.org.springframework.security=WARN

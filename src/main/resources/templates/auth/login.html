<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso — JavaDuolingo</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-logo">
            <span class="mascot">☕</span>
            <h1>JavaDuolingo</h1>
            <p>Aprenda Java do jeito certo, do zero ao júnior!</p>
        </div>

        <div th:if="${error}" class="alert alert-error">Senha incorreta. Tente novamente.</div>

        <form th:action="@{/auth/login}" method="post">
            <input type="hidden" name="username" value="admin">
            <div class="form-group">
                <label class="form-label">Senha de acesso</label>
                <input type="password" name="password" class="form-input"
                       placeholder="Digite a senha" required autofocus autocomplete="current-password">
            </div>
            <div class="form-group" style="display:flex;align-items:center;gap:8px;margin-top:4px;">
                <input type="checkbox" name="remember-me" id="remember-me"
                       style="width:18px;height:18px;accent-color:#58CC02;cursor:pointer;">
                <label for="remember-me" style="font-size:14px;color:#555;cursor:pointer;margin:0;">
                    Lembrar por 30 dias
                </label>
            </div>
            <button type="submit" class="btn btn-primary btn-full" style="margin-top:12px;">
                Entrar 🚀
            </button>
        </form>
    </div>
</div>
</body>
</html>

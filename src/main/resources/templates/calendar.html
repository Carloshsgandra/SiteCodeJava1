<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendário de Estudos — JavaDuolingo</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <style>
        .cal-layout { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }
        .cal-header { margin-bottom: 28px; }
        .cal-header h1 { font-size: 22px; font-weight: 800; }
        .cal-header p { font-size: 13px; color: var(--gray-400); margin-top: 4px; }

        /* Stats row */
        .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 28px; }
        .stat-card { background: white; border-radius: 14px; border: 2px solid var(--gray-200); padding: 16px; text-align: center; }
        .stat-card .stat-val { font-size: 28px; font-weight: 900; color: var(--green); line-height: 1; }
        .stat-card .stat-lbl { font-size: 12px; color: var(--gray-400); margin-top: 4px; font-weight: 600; }
        .stat-card .stat-icon { font-size: 22px; margin-bottom: 6px; }

        /* Heatmap */
        .heatmap-card { background: white; border-radius: 16px; border: 2px solid var(--gray-200); padding: 24px; margin-bottom: 24px; overflow-x: auto; }
        .heatmap-card h2 { font-size: 16px; font-weight: 800; margin-bottom: 16px; }
        .heatmap-wrap { display: flex; gap: 4px; align-items: flex-start; }
        .day-labels { display: flex; flex-direction: column; gap: 2px; padding-top: 20px; }
        .day-label { font-size: 10px; color: var(--gray-400); height: 13px; line-height: 13px; width: 24px; text-align: right; padding-right: 4px; }
        .weeks-grid { display: flex; flex-direction: column; gap: 0; }
        .month-labels { display: flex; gap: 2px; margin-bottom: 4px; height: 16px; }
        .month-label { font-size: 11px; color: var(--gray-400); font-weight: 600; }
        .weeks-row { display: flex; gap: 2px; }
        .heat-cell { width: 13px; height: 13px; border-radius: 3px; cursor: pointer; transition: transform 0.1s; position: relative; }
        .heat-cell:hover { transform: scale(1.3); z-index: 10; }
        .heat-0 { background: #ebedf0; }
        .heat-1 { background: #c6e48b; }
        .heat-2 { background: #7bc96f; }
        .heat-3 { background: #239a3b; }
        .heat-4 { background: #196127; }
        body.dark-mode .heat-0 { background: #2d333b; }
        .legend { display: flex; align-items: center; gap: 6px; margin-top: 12px; font-size: 11px; color: var(--gray-400); }
        .legend-cells { display: flex; gap: 2px; }

        /* Tooltip */
        .heat-tooltip { position: fixed; background: #1F1F1F; color: white; padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: 600; pointer-events: none; z-index: 999; display: none; white-space: nowrap; }

        /* Monthly breakdown */
        .month-breakdown { background: white; border-radius: 16px; border: 2px solid var(--gray-200); padding: 24px; }
        .month-breakdown h2 { font-size: 16px; font-weight: 800; margin-bottom: 16px; }
        .month-list { display: flex; flex-direction: column; gap: 10px; }
        .month-row { display: flex; align-items: center; gap: 12px; }
        .month-name { width: 80px; font-size: 13px; font-weight: 700; }
        .month-bar-wrap { flex: 1; height: 12px; background: var(--gray-200); border-radius: 6px; overflow: hidden; }
        .month-bar { height: 100%; background: var(--green); border-radius: 6px; transition: width 0.8s ease; }
        .month-count { font-size: 13px; font-weight: 700; color: var(--green); width: 48px; text-align: right; }

        /* Dark mode */
        body.dark-mode .stat-card,
        body.dark-mode .heatmap-card,
        body.dark-mode .month-breakdown { background: #2d2d2d; border-color: #3a3a3a; }
        body.dark-mode .month-bar-wrap { background: #3a3a3a; }

        @media (max-width: 600px) {
            .stats-row { grid-template-columns: 1fr 1fr; }
            .stat-card .stat-val { font-size: 22px; }
        }
    </style>
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar(${user})}"></div>
    <div class="heat-tooltip" id="heat-tooltip"></div>

    <div class="cal-layout">
        <div class="cal-header">
            <h1>📅 Calendário de Estudos</h1>
            <p>Seu histórico de atividade — cada célula = um dia de estudo</p>
        </div>

        <!-- Stats -->
        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-icon">🔥</div>
                <div class="stat-val" th:text="${streak}">0</div>
                <div class="stat-lbl">Sequência atual</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📅</div>
                <div class="stat-val" th:text="${totalDays}">0</div>
                <div class="stat-lbl">Dias estudados</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📚</div>
                <div class="stat-val" th:text="${totalLessons}">0</div>
                <div class="stat-lbl">Lições completas</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⚡</div>
                <div class="stat-val" th:text="${user.xp}">0</div>
                <div class="stat-lbl">XP total</div>
            </div>
        </div>

        <!-- Heatmap -->
        <div class="heatmap-card">
            <h2>Atividade nos últimos 12 meses</h2>
            <div class="heatmap-wrap">
                <div class="day-labels">
                    <div class="day-label"></div>
                    <div class="day-label">Seg</div>
                    <div class="day-label"></div>
                    <div class="day-label">Qua</div>
                    <div class="day-label"></div>
                    <div class="day-label">Sex</div>
                    <div class="day-label"></div>
                </div>
                <div class="weeks-grid">
                    <div class="month-labels" id="month-labels"></div>
                    <div class="weeks-row" id="heatmap-grid"></div>
                </div>
            </div>
            <div class="legend">
                <span>Menos</span>
                <div class="legend-cells">
                    <div class="heat-cell heat-0"></div>
                    <div class="heat-cell heat-1"></div>
                    <div class="heat-cell heat-2"></div>
                    <div class="heat-cell heat-3"></div>
                    <div class="heat-cell heat-4"></div>
                </div>
                <span>Mais</span>
            </div>
        </div>

        <!-- Monthly breakdown -->
        <div class="month-breakdown">
            <h2>Lições por mês</h2>
            <div class="month-list" id="month-breakdown"></div>
        </div>
    </div>

    <script th:src="@{/js/app.js}"></script>
    <script th:inline="javascript">
        var activityData = /*[[${activityJson}]]*/ {};
        var maxInDay     = /*[[${maxInDay}]]*/ 1;

        var MONTHS_PT = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
        var tooltip = document.getElementById('heat-tooltip');

        function buildHeatmap() {
            var today = new Date();
            today.setHours(0,0,0,0);

            // Start from 52 weeks ago, aligned to Sunday
            var start = new Date(today);
            start.setDate(start.getDate() - 364);
            // Align to Sunday
            start.setDate(start.getDate() - start.getDay());

            var grid = document.getElementById('heatmap-grid');
            var monthLabels = document.getElementById('month-labels');
            grid.innerHTML = '';
            monthLabels.innerHTML = '';

            var weekCols = [];
            var cur = new Date(start);
            var lastMonth = -1;
            var weekIdx = 0;

            while (cur <= today) {
                var col = document.createElement('div');
                col.style.cssText = 'display:flex;flex-direction:column;gap:2px;';

                for (var d = 0; d < 7; d++) {
                    var dateStr = toDateStr(cur);
                    var count = activityData[dateStr] || 0;
                    var heat = getHeatLevel(count);
                    var cell = document.createElement('div');
                    cell.className = 'heat-cell heat-' + heat;
                    cell.dataset.date = dateStr;
                    cell.dataset.count = count;

                    // Month label tracking
                    if (cur.getMonth() !== lastMonth && cur.getDate() <= 7) {
                        // We'll add month label at weekIdx position
                    }

                    (function(c, ds, ct) {
                        c.addEventListener('mousemove', function(e) {
                            tooltip.style.display = 'block';
                            tooltip.style.left = (e.clientX + 12) + 'px';
                            tooltip.style.top  = (e.clientY - 28) + 'px';
                            var parts = ds.split('-');
                            var label = parseInt(parts[2]) + ' ' + MONTHS_PT[parseInt(parts[1])-1] + ' ' + parts[0];
                            tooltip.textContent = ct > 0 ? ct + ' lição' + (ct>1?'ões':'') + ' em ' + label : 'Nenhuma atividade em ' + label;
                        });
                        c.addEventListener('mouseleave', function() { tooltip.style.display = 'none'; });
                    })(cell, dateStr, count);

                    col.appendChild(cell);
                    cur.setDate(cur.getDate() + 1);
                    if (d === 0 && cur.getMonth() !== lastMonth) {
                        lastMonth = cur.getMonth();
                    }
                }
                grid.appendChild(col);
                weekIdx++;
            }

            // Build month labels by scanning weeks
            buildMonthLabels(start, today);
        }

        function buildMonthLabels(start, today) {
            var labels = document.getElementById('month-labels');
            labels.innerHTML = '';
            var cur = new Date(start);
            var lastMonth = -1;
            var weekIdx = 0;
            var totalWeeks = 0;

            // Count total weeks
            var tmp = new Date(start);
            while (tmp <= today) { tmp.setDate(tmp.getDate() + 7); totalWeeks++; }

            tmp = new Date(start);
            var monthPositions = {};
            var wk = 0;
            while (tmp <= today) {
                if (tmp.getMonth() !== lastMonth) {
                    lastMonth = tmp.getMonth();
                    monthPositions[wk] = MONTHS_PT[lastMonth];
                }
                tmp.setDate(tmp.getDate() + 7);
                wk++;
            }

            for (var i = 0; i < totalWeeks; i++) {
                var span = document.createElement('div');
                span.className = 'month-label';
                span.style.width = '15px';
                span.textContent = monthPositions[i] || '';
                labels.appendChild(span);
            }
        }

        function buildMonthBreakdown() {
            var breakdown = {};
            for (var dateStr in activityData) {
                var parts = dateStr.split('-');
                var key = parts[0] + '-' + parts[1];
                breakdown[key] = (breakdown[key] || 0) + activityData[dateStr];
            }
            var keys = Object.keys(breakdown).sort().slice(-12);
            var maxVal = Math.max.apply(null, keys.map(function(k){ return breakdown[k]; })) || 1;

            var container = document.getElementById('month-breakdown');
            if (keys.length === 0) {
                container.innerHTML = '<p style="color:var(--gray-400);font-size:14px;">Nenhuma atividade registrada ainda. Complete lições para ver seu progresso aqui!</p>';
                return;
            }
            keys.forEach(function(key) {
                var parts = key.split('-');
                var label = MONTHS_PT[parseInt(parts[1])-1] + ' ' + parts[0];
                var count = breakdown[key];
                var pct = Math.round(count / maxVal * 100);
                var row = document.createElement('div');
                row.className = 'month-row';
                row.innerHTML = '<div class="month-name">' + label + '</div>' +
                    '<div class="month-bar-wrap"><div class="month-bar" style="width:0%" data-pct="' + pct + '"></div></div>' +
                    '<div class="month-count">' + count + ' lições</div>';
                container.appendChild(row);
            });
            // Animate bars
            requestAnimationFrame(function() {
                setTimeout(function() {
                    document.querySelectorAll('.month-bar').forEach(function(bar) {
                        bar.style.width = bar.dataset.pct + '%';
                    });
                }, 100);
            });
        }

        function getHeatLevel(count) {
            if (count === 0) return 0;
            if (maxInDay <= 1) return count > 0 ? 2 : 0;
            var pct = count / maxInDay;
            if (pct <= 0.25) return 1;
            if (pct <= 0.50) return 2;
            if (pct <= 0.75) return 3;
            return 4;
        }

        function toDateStr(d) {
            var y = d.getFullYear();
            var m = String(d.getMonth()+1).padStart(2,'0');
            var day = String(d.getDate()).padStart(2,'0');
            return y + '-' + m + '-' + day;
        }

        buildHeatmap();
        buildMonthBreakdown();
    </script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${exam.title + ' — JavaDuolingo'}">Prova</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar(${user})}"></div>

<div class="exam-wrapper">

    <!-- Header -->
    <div class="exam-info-header card" style="text-align:center; padding:40px 32px; margin-bottom:24px;">
        <div style="font-size:64px; margin-bottom:16px;" th:text="${exam.icon}">📋</div>
        <h1 style="font-size:26px; font-weight:800; margin-bottom:8px;" th:text="${exam.title}">Prova</h1>
        <p style="color:var(--gray-400); font-size:15px; max-width:480px; margin:0 auto 24px;"
           th:text="${exam.description}">Descrição</p>

        <div style="display:flex; justify-content:center; gap:32px; flex-wrap:wrap; margin-bottom:32px;">
            <div style="text-align:center;">
                <div style="font-size:28px; font-weight:800;" th:text="${questionCount}">10</div>
                <div style="font-size:13px; color:var(--gray-400);">Questões</div>
            </div>
            <div style="text-align:center;">
                <div style="font-size:28px; font-weight:800;" th:text="${exam.timeLimitMinutes + ' min'}">30 min</div>
                <div style="font-size:13px; color:var(--gray-400);">Tempo limite</div>
            </div>
            <div style="text-align:center;">
                <div style="font-size:28px; font-weight:800; color:var(--green);" th:text="${exam.passingScore + '%'}">70%</div>
                <div style="font-size:13px; color:var(--gray-400);">Para passar</div>
            </div>
        </div>

        <!-- Best attempt -->
        <div th:if="${bestAttempt != null}" style="margin-bottom:24px;">
            <div th:if="${bestAttempt.passed}"
                 style="display:inline-flex; align-items:center; gap:8px; background:var(--green-light); color:var(--green-dark); padding:10px 20px; border-radius:999px; font-weight:700; font-size:15px;">
                ✓ Aprovado — Melhor nota: <span th:text="${bestAttempt.score + '%'}">0%</span>
            </div>
            <div th:unless="${bestAttempt.passed}"
                 style="display:inline-flex; align-items:center; gap:8px; background:#FFF0F0; color:var(--red); padding:10px 20px; border-radius:999px; font-weight:700; font-size:15px;">
                ✗ Melhor nota: <span th:text="${bestAttempt.score + '%'}">0%</span> — Tente novamente!
            </div>
        </div>

        <a th:href="'/exam/' + ${exam.id} + '/take'" class="btn btn-primary btn-lg">
            <span th:text="${bestAttempt != null ? '🔄 Refazer Prova' : '🚀 Iniciar Prova'}">Iniciar</span>
        </a>
        <a href="/dashboard" class="btn btn-outline" style="margin-left:12px;">← Voltar</a>
    </div>

    <!-- History -->
    <div class="card" th:if="${!history.empty}">
        <h2 style="font-size:18px; font-weight:800; margin-bottom:16px;">📊 Histórico de Tentativas</h2>
        <div th:each="h, hStat : ${history}" style="display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--gray-200);"
             th:unless="${hStat.last and hStat.first}">
            <div style="width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:800;"
                 th:style="'width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;background:' + (${h.passed} ? 'var(--green-light);color:var(--green-dark)' : '#FFF0F0;color:var(--red)')"
                 th:text="${h.score + '%'}">0%</div>
            <div style="flex:1;">
                <div style="font-weight:700; font-size:14px;" th:text="${h.passed ? 'Aprovado ✓' : 'Reprovado ✗'}"></div>
                <div style="font-size:12px; color:var(--gray-400);"
                     th:text="${h.correctAnswers + '/' + h.totalQuestions + ' corretas'}"></div>
            </div>
            <a th:href="'/exam/result/' + ${h.id}" class="btn btn-outline btn-sm">Ver resultado</a>
        </div>
        <div th:if="${#lists.size(history) == 1}" style="display:flex; align-items:center; gap:12px; padding:12px 0;">
            <div style="width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:800;"
                 th:style="'width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;background:' + (${history[0].passed} ? 'var(--green-light);color:var(--green-dark)' : '#FFF0F0;color:var(--red)')"
                 th:text="${history[0].score + '%'}">0%</div>
            <div style="flex:1;">
                <div style="font-weight:700; font-size:14px;" th:text="${history[0].passed ? 'Aprovado ✓' : 'Reprovado ✗'}"></div>
                <div style="font-size:12px; color:var(--gray-400);"
                     th:text="${history[0].correctAnswers + '/' + history[0].totalQuestions + ' corretas'}"></div>
            </div>
            <a th:href="'/exam/result/' + ${history[0].id}" class="btn btn-outline btn-sm">Ver resultado</a>
        </div>
    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<th:block th:fragment="navbar(user)">
<nav class="navbar">
    <a href="/dashboard" class="navbar-brand">
        <span class="logo-icon">☕</span>
        JavaDuolingo
    </a>

    <div class="navbar-stats">
        <div class="stat-badge streak">
            <span class="icon">🔥</span>
            <span class="count" th:text="${user.streakDays}">0</span>
        </div>
        <div class="stat-badge hearts">
            <span class="icon">❤️</span>
            <span class="count" th:text="${user.hearts}">5</span>
        </div>
        <div class="stat-badge xp">
            <span class="icon">⚡</span>
            <span class="count" id="xp-display" th:text="${user.xp + ' XP'}">0 XP</span>
        </div>
    </div>

    <div class="navbar-user">
        <button class="dark-toggle-btn" title="Alternar Tema">🌙</button>
        <a href="/review"      class="navbar-chat-btn" title="Revisar Erros">📝</a>
        <a href="/daily"       class="navbar-chat-btn" title="Desafio Diário">📅</a>
        <a href="/flashcards"  class="navbar-chat-btn" title="Flashcards">🃏</a>
        <a href="/playground"  class="navbar-chat-btn" title="Playground">⌨️</a>
        <a href="/chat"        class="navbar-chat-btn" title="JavaBot">💬</a>
        <a href="/profile" style="text-decoration:none; display:flex; align-items:center; gap:8px;">
            <div class="avatar" th:style="'background:' + ${user.avatarColor}"
                 th:text="${#strings.substring(user.username, 0, 1).toUpperCase()}">U</div>
            <span class="nav-username" style="font-weight:700; font-size:14px;" th:text="${user.username}">User</span>
        </a>
        <form th:action="@{/auth/logout}" method="post" style="margin:0;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit" class="btn-logout">Sair</button>
        </form>
    </div>
</nav>

<!-- Bottom Navigation (mobile only) -->
<nav class="bottom-nav">
    <div class="bottom-nav-items">
        <a href="/dashboard" class="bottom-nav-item" data-path="/dashboard">
            <span class="nav-icon">🏠</span>
            <span>Início</span>
        </a>
        <a href="/daily" class="bottom-nav-item" data-path="/daily">
            <span class="nav-icon">📅</span>
            <span>Diário</span>
        </a>
        <a href="/review" class="bottom-nav-item" data-path="/review">
            <span class="nav-icon">📝</span>
            <span>Erros</span>
        </a>
        <a href="/profile" class="bottom-nav-item" data-path="/profile">
            <span class="nav-icon">👤</span>
            <span>Perfil</span>
        </a>
    </div>
</nav>
</th:block>
</body>
</html>

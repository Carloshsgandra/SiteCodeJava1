<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar(user)" class="navbar">
    <a href="/dashboard" class="navbar-brand">
        <span class="logo-icon">☕</span>
        JavaDuolingo
    </a>

    <div class="navbar-stats">
        <div class="stat-badge streak">
            <span class="icon">🔥</span>
            <span class="count" th:text="${user.streakDays}">0</span>
        </div>
        <div class="stat-badge hearts">
            <span class="icon">❤️</span>
            <span class="count" th:text="${user.hearts}">5</span>
        </div>
        <div class="stat-badge xp">
            <span class="icon">⚡</span>
            <span class="count" id="xp-display" th:text="${user.xp + ' XP'}">0 XP</span>
        </div>
    </div>

    <div class="navbar-user">
        <a href="/profile" style="text-decoration:none; display:flex; align-items:center; gap:8px;">
            <div class="avatar" th:style="'background:' + ${user.avatarColor}"
                 th:text="${#strings.substring(user.username, 0, 1).toUpperCase()}">U</div>
            <span style="font-weight:700; font-size:14px;" th:text="${user.username}">User</span>
        </a>
        <form th:action="@{/auth/logout}" method="post" style="margin:0;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit" class="btn-logout">Sair</button>
        </form>
    </div>
</nav>
</body>
</html>

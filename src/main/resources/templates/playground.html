<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playground — JavaDuolingo</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <style>
        .playground-layout { display:flex; height:calc(100vh - 64px); overflow:hidden; }
        .editor-pane { flex:1; display:flex; flex-direction:column; min-width:0; }
        .output-pane { width:380px; display:flex; flex-direction:column; background:#1a1a1a; border-left:2px solid #333; flex-shrink:0; }
        .pane-header { padding:12px 16px; font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:space-between; border-bottom:2px solid #333; }
        .editor-pane .pane-header { background:#fff; border-bottom:2px solid var(--gray-200); color:var(--dark); }
        .output-pane .pane-header { background:#252525; color:#aaa; }
        #monaco-editor { flex:1; }
        .editor-actions { display:flex; gap:8px; }
        #output-content { flex:1; overflow-y:auto; padding:16px; font-family:'Courier New',monospace; font-size:13px; line-height:1.6; color:#e0e0e0; white-space:pre-wrap; word-break:break-word; }
        #output-content.error { color:#ff8080; }
        #output-content.loading { color:#888; }
        #review-content { padding:16px; font-size:13px; line-height:1.6; color:#ccc; overflow-y:auto; border-top:2px solid #333; max-height:45%; white-space:pre-wrap; }
        .template-btn { background:none; border:1px solid var(--gray-200); border-radius:6px; padding:4px 10px; font-size:12px; cursor:pointer; color:var(--gray-700); transition:all .15s; }
        .template-btn:hover { border-color:var(--green); color:var(--green); }
        .btn-run { background:#58CC02; color:white; border:none; border-radius:8px; padding:8px 20px; font-weight:700; font-size:14px; cursor:pointer; display:flex;align-items:center;gap:6px; }
        .btn-run:hover { background:#46A302; }
        .btn-run:disabled { opacity:.5; cursor:not-allowed; }
        .btn-review { background:#1CB0F6; color:white; border:none; border-radius:8px; padding:8px 16px; font-weight:700; font-size:14px; cursor:pointer; }
        .btn-review:hover { background:#0e8fc4; }
        @media(max-width:768px) {
            .playground-layout { flex-direction:column; height:auto; }
            .output-pane { width:100%; height:300px; border-left:none; border-top:2px solid #333; }
            #monaco-editor { height:300px; }
        }
    </style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar(${user})}"></div>

<div class="playground-layout">
    <!-- Editor -->
    <div class="editor-pane">
        <div class="pane-header playground-pane-header">
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <button class="template-btn" onclick="setTemplate('hello')">Hello World</button>
                <button class="template-btn" onclick="setTemplate('loop')">Loop</button>
                <button class="template-btn" onclick="setTemplate('array')">Array</button>
                <button class="template-btn" onclick="setTemplate('class')">Classe</button>
                <button class="template-btn" onclick="setTemplate('method')">Métodos</button>
            </div>
            <div class="editor-actions">
                <button class="btn-review" id="review-btn" onclick="reviewCode()">🤖 Revisar com IA</button>
                <button class="btn-run" id="run-btn" onclick="runCode()">▶ Executar</button>
            </div>
        </div>
        <div id="monaco-editor"></div>
    </div>

    <!-- Output + Review -->
    <div class="output-pane">
        <div class="pane-header">
            <span>⚡ Saída <span id="exec-mode-badge" style="display:none; font-size:10px; background:#333; padding:2px 7px; border-radius:10px; margin-left:6px; font-weight:600;"></span></span>
            <button onclick="clearOutput()" style="background:none;border:none;color:#888;cursor:pointer;font-size:12px;">Limpar</button>
        </div>
        <pre id="output-content" class="loading">Clique em ▶ Executar para rodar seu código...</pre>
        <div class="pane-header" style="border-top:2px solid #333;">
            <span>🤖 Revisão IA</span>
        </div>
        <div id="review-content">Clique em "Revisar com IA" para analisar seu código.</div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
<script>
    let editor;
    const templates = {
        hello: `public class Main {\n    public static void main(String[] args) {\n        System.out.println("Olá, Java!");\n    }\n}`,
        loop:  `public class Main {\n    public static void main(String[] args) {\n        for (int i = 1; i <= 5; i++) {\n            System.out.println("Número: " + i);\n        }\n    }\n}`,
        array: `public class Main {\n    public static void main(String[] args) {\n        int[] nums = {10, 20, 30, 40, 50};\n        int soma = 0;\n        for (int n : nums) soma += n;\n        System.out.println("Soma: " + soma);\n    }\n}`,
        class: `public class Pessoa {\n    String nome;\n    int idade;\n\n    Pessoa(String nome, int idade) {\n        this.nome = nome;\n        this.idade = idade;\n    }\n\n    void apresentar() {\n        System.out.println("Olá, sou " + nome + " e tenho " + idade + " anos.");\n    }\n\n    public static void main(String[] args) {\n        Pessoa p = new Pessoa("Ana", 25);\n        p.apresentar();\n    }\n}`,
        method:`public class Main {\n    static int fatorial(int n) {\n        if (n <= 1) return 1;\n        return n * fatorial(n - 1);\n    }\n\n    public static void main(String[] args) {\n        System.out.println("5! = " + fatorial(5));\n        System.out.println("10! = " + fatorial(10));\n    }\n}`
    };

    require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' }});
    require(['vs/editor/editor.main'], function() {
        editor = monaco.editor.create(document.getElementById('monaco-editor'), {
            value: templates.hello,
            language: 'java',
            theme: 'vs-dark',
            fontSize: 14,
            minimap: { enabled: false },
            automaticLayout: true,
            scrollBeyondLastLine: false,
            wordWrap: 'on'
        });
    });

    function setTemplate(name) {
        if (editor) editor.setValue(templates[name]);
    }

    function runCode() {
        const code = editor ? editor.getValue() : '';
        const btn = document.getElementById('run-btn');
        const out = document.getElementById('output-content');
        btn.disabled = true;
        btn.textContent = '⏳ Executando...';
        out.className = 'loading';
        out.textContent = 'Compilando e executando...';

        fetch('/api/code/run', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code })
        })
        .then(r => r.json())
        .then(data => {
            out.className = data.type === 'error' ? 'error' : '';
            out.textContent = data.output || '(sem saída)';
            btn.disabled = false;
            btn.innerHTML = '▶ Executar';
            // mostra badge quando execução foi via IA
            const badge = document.getElementById('exec-mode-badge');
            if (badge) {
                badge.textContent = data.source === 'ai' ? '🤖 via IA' : '⚡ JDK local';
                badge.style.display = 'inline';
            }
        })
        .catch(() => {
            out.className = 'error';
            out.textContent = 'Erro ao conectar ao servidor de execução.';
            btn.disabled = false;
            btn.innerHTML = '▶ Executar';
        });
    }

    function reviewCode() {
        const code = editor ? editor.getValue() : '';
        const btn = document.getElementById('review-btn');
        const rev = document.getElementById('review-content');
        btn.disabled = true;
        rev.textContent = '🤖 Analisando seu código...';

        fetch('/api/javabot/review', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code })
        })
        .then(r => r.json())
        .then(data => {
            rev.textContent = data.review;
            btn.disabled = false;
        })
        .catch(() => {
            rev.textContent = 'Erro ao conectar ao JavaBot.';
            btn.disabled = false;
        });
    }

    function clearOutput() {
        document.getElementById('output-content').className = 'loading';
        document.getElementById('output-content').textContent = 'Clique em ▶ Executar para rodar seu código...';
    }

    document.addEventListener('keydown', e => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); runCode(); }
    });
</script>
</body>
</html>

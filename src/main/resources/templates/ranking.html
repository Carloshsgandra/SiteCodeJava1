<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking — JavaDuolingo</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <style>
        :root { --gold:#F5A623; --silver:#A0AEC0; --bronze:#CD7F32; }

        .ranking-page { max-width: 680px; margin: 0 auto; padding: 20px 16px 100px; }

        /* Hero */
        .ranking-hero {
            text-align: center; margin-bottom: 28px;
        }
        .ranking-hero h1 { font-size: 28px; font-weight: 900; color: #111; margin-bottom: 4px; }
        .ranking-hero p  { color: #6B7280; font-size: 14px; }

        /* User position card */
        .my-rank-card {
            background: linear-gradient(135deg, #58CC02 0%, #46a602 100%);
            border-radius: 18px; padding: 18px 20px;
            display: flex; align-items: center; gap: 16px;
            margin-bottom: 28px; box-shadow: 0 4px 20px rgba(88,204,2,.3);
        }
        .my-rank-number {
            font-size: 36px; font-weight: 900; color: white;
            min-width: 56px; text-align: center; line-height: 1;
        }
        .my-rank-number small { display: block; font-size: 12px; font-weight: 600; opacity: .8; }
        .my-rank-info { flex: 1; }
        .my-rank-info .name { font-size: 18px; font-weight: 800; color: white; }
        .my-rank-info .xp-row { font-size: 13px; color: rgba(255,255,255,.85); margin-top: 2px; }
        .my-rank-pct {
            font-size: 12px; font-weight: 700; color: rgba(255,255,255,.9);
            background: rgba(255,255,255,.2); border-radius: 20px;
            padding: 4px 10px; white-space: nowrap;
        }

        /* Podium */
        .podium-wrap {
            display: flex; align-items: flex-end; justify-content: center;
            gap: 8px; margin-bottom: 28px; padding: 0 4px;
        }
        .podium-item {
            flex: 1; display: flex; flex-direction: column; align-items: center;
            max-width: 140px;
        }
        .podium-avatar {
            width: 52px; height: 52px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; font-weight: 900; color: white;
            margin-bottom: 8px; position: relative;
        }
        .podium-medal {
            position: absolute; top: -10px; right: -6px;
            font-size: 20px; filter: drop-shadow(0 2px 4px rgba(0,0,0,.2));
        }
        .podium-name { font-size: 12px; font-weight: 700; color: #111; text-align: center; margin-bottom: 4px; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .podium-xp   { font-size: 11px; color: #6B7280; margin-bottom: 6px; }
        .podium-bar  {
            width: 100%; border-radius: 10px 10px 0 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: 900; color: white;
        }
        .podium-bar.p1 { background: linear-gradient(160deg,#FFD700,#F5A623); height: 80px; }
        .podium-bar.p2 { background: linear-gradient(160deg,#C0C0C0,#A0AEC0); height: 60px; }
        .podium-bar.p3 { background: linear-gradient(160deg,#CD7F32,#A05A2C); height: 45px; }
        .podium-item.rank2 { order: -1; }

        /* List */
        .ranking-list { display: flex; flex-direction: column; gap: 8px; }

        .rank-row {
            display: flex; align-items: center; gap: 12px;
            background: white; border: 2px solid #F3F4F6;
            border-radius: 14px; padding: 12px 16px;
            transition: transform .1s, border-color .1s;
        }
        .rank-row:hover { transform: translateX(4px); border-color: #E5E7EB; }
        .rank-row.is-me {
            border-color: #58CC02; background: #F0FFF0;
        }
        .rank-row.is-me .rank-pos { color: #46a602; }

        .rank-pos {
            font-size: 16px; font-weight: 900; color: #9CA3AF;
            min-width: 32px; text-align: center;
        }
        .rank-avatar {
            width: 40px; height: 40px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; font-weight: 900; color: white; flex-shrink: 0;
        }
        .rank-name-col { flex: 1; min-width: 0; }
        .rank-name { font-size: 14px; font-weight: 700; color: #111; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .rank-streak { font-size: 11px; color: #9CA3AF; }
        .rank-xp-col { text-align: right; flex-shrink: 0; }
        .rank-xp-val { font-size: 15px; font-weight: 800; color: #58CC02; }
        .rank-xp-lbl { font-size: 10px; color: #9CA3AF; }
        .rank-me-badge {
            font-size: 10px; font-weight: 700; color: #58CC02;
            background: #E8F9D4; border-radius: 10px; padding: 2px 7px;
            flex-shrink: 0;
        }

        /* Section title */
        .section-title {
            font-size: 13px; font-weight: 700; color: #9CA3AF;
            text-transform: uppercase; letter-spacing: .06em;
            margin: 0 0 12px; padding-left: 4px;
        }

        /* Dark mode */
        .dark-mode .ranking-hero h1 { color: #eee; }
        .dark-mode .rank-row { background: #1e1e1e; border-color: #333; }
        .dark-mode .rank-row.is-me { background: #0d2e0d; border-color: #58CC02; }
        .dark-mode .rank-name { color: #ddd; }
        .dark-mode .podium-name { color: #ddd; }

        /* Mobile */
        @media (max-width: 480px) {
            .ranking-hero h1 { font-size: 22px; }
            .podium-avatar { width: 44px; height: 44px; font-size: 18px; }
            .my-rank-pct { display: none; }
        }
    </style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar(${user})}"></div>

<div class="ranking-page">

    <div class="ranking-hero">
        <h1>🏆 Ranking Global</h1>
        <p th:text="'Top ' + ${topUsers.size()} + ' de ' + ${totalUsers} + ' programadores'">Top 20 de 100 programadores</p>
    </div>

    <!-- Minha posição -->
    <div class="my-rank-card">
        <div class="my-rank-number">
            <span th:text="'#' + ${userRank}">?</span>
            <small>sua posição</small>
        </div>
        <div class="my-rank-info">
            <div class="name" th:text="${user.username}">Você</div>
            <div class="xp-row">
                ⚡ <span th:text="${user.xp}">0</span> XP &nbsp;·&nbsp;
                🔥 <span th:text="${user.streakDays}">0</span> dias de streak
            </div>
        </div>
        <div class="my-rank-pct"
             th:text="'Top ' + ${#numbers.formatDecimal(userRank * 100.0 / totalUsers, 0, 0)} + '%'">Top ?%</div>
    </div>

    <!-- Pódio top 3 -->
    <th:block th:if="${topUsers.size() >= 3}">
        <p class="section-title">Pódio</p>
        <div class="podium-wrap">
            <!-- 2º -->
            <div class="podium-item rank2">
                <div class="podium-avatar" th:style="'background:' + ${topUsers[1].avatarColor}">
                    <span th:text="${#strings.substring(topUsers[1].username,0,1).toUpperCase()}">B</span>
                    <span class="podium-medal">🥈</span>
                </div>
                <div class="podium-name" th:text="${topUsers[1].username}">2nd</div>
                <div class="podium-xp" th:text="${topUsers[1].xp} + ' XP'">0 XP</div>
                <div class="podium-bar p2">2</div>
            </div>
            <!-- 1º -->
            <div class="podium-item rank1">
                <div class="podium-avatar" th:style="'background:' + ${topUsers[0].avatarColor}" style="width:62px;height:62px;font-size:26px;">
                    <span th:text="${#strings.substring(topUsers[0].username,0,1).toUpperCase()}">A</span>
                    <span class="podium-medal">🥇</span>
                </div>
                <div class="podium-name" th:text="${topUsers[0].username}">1st</div>
                <div class="podium-xp" th:text="${topUsers[0].xp} + ' XP'">0 XP</div>
                <div class="podium-bar p1">1</div>
            </div>
            <!-- 3º -->
            <div class="podium-item rank3">
                <div class="podium-avatar" th:style="'background:' + ${topUsers[2].avatarColor}">
                    <span th:text="${#strings.substring(topUsers[2].username,0,1).toUpperCase()}">C</span>
                    <span class="podium-medal">🥉</span>
                </div>
                <div class="podium-name" th:text="${topUsers[2].username}">3rd</div>
                <div class="podium-xp" th:text="${topUsers[2].xp} + ' XP'">0 XP</div>
                <div class="podium-bar p3">3</div>
            </div>
        </div>
    </th:block>

    <!-- Lista completa (posição 4 em diante) -->
    <th:block th:if="${topUsers.size() > 3}">
        <p class="section-title">Classificação completa</p>
        <div class="ranking-list">
            <th:block th:each="u, stat : ${topUsers}">
                <div class="rank-row"
                     th:classappend="${u.username == user.username} ? 'is-me' : ''">
                    <div class="rank-pos">
                        <span th:if="${stat.index == 0}">🥇</span>
                        <span th:if="${stat.index == 1}">🥈</span>
                        <span th:if="${stat.index == 2}">🥉</span>
                        <span th:if="${stat.index >= 3}" th:text="${stat.index + 1}">#</span>
                    </div>
                    <div class="rank-avatar" th:style="'background:' + ${u.avatarColor}"
                         th:text="${#strings.substring(u.username,0,1).toUpperCase()}">U</div>
                    <div class="rank-name-col">
                        <div class="rank-name" th:text="${u.username}">User</div>
                        <div class="rank-streak" th:text="'🔥 ' + ${u.streakDays} + ' dias'">0 dias</div>
                    </div>
                    <span th:if="${u.username == user.username}" class="rank-me-badge">Você</span>
                    <div class="rank-xp-col">
                        <div class="rank-xp-val" th:text="${u.xp}">0</div>
                        <div class="rank-xp-lbl">XP</div>
                    </div>
                </div>
            </th:block>
        </div>
    </th:block>

    <!-- Estado vazio -->
    <th:block th:if="${topUsers.size() == 0}">
        <div style="text-align:center;padding:60px 0;color:#9CA3AF;">
            <div style="font-size:48px;margin-bottom:12px;">🏆</div>
            <p>Nenhum usuário ainda. Seja o primeiro!</p>
        </div>
    </th:block>

</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
